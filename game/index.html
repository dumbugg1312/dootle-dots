<!doctype html>
<html><head><meta charset="utf-8"><title>Dootle Dots</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0e070c; overflow: hidden; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; }
</style></head>
<body><canvas id="c" width="320" height="180"></canvas>
<script>
// The game needs a keyboard. A phone or tablet (touch, and no hovering pointer or a mobile browser) gets the desktop-only card
// in desktop.js instead of the game; a key press there, or ?desktop, loads the game anyway. Everything else loads on demand:
// levels all at once at boot (menu.js), music track by track as the game reaches it (music.js), voice clips and sprites as played.
(function () {
  var Q = new URLSearchParams(location.search), kb = false;
  try { kb = sessionStorage.getItem('dootledots.keyboard') === '1'; } catch (e) {}
  var touch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
  var phone = /Android|iPhone|iPad|iPod|Mobile|Silk|Opera Mini/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS calls itself a Mac
  var hover = matchMedia('(any-hover: hover)').matches;
  var mobile = !kb && !Q.has('desktop') && touch && (phone || !hover);
  var list = mobile ? ['engine.js', 'desktop.js']
    : ['classics.js', 'engine.js', 'worlds.js', 'bonus.js', 'posters.js', 'menu.js', 'music/cues.js', 'music.js', 'voice/clips.js', 'voice/cues.js', 'voice.js'];
  for (var i = 0; i < list.length; i++) { var s = document.createElement('script'); s.src = list[i]; s.async = false; document.body.appendChild(s); }
})();
</script>
</body></html>
